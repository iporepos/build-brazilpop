# ==============================================================================
# build-brazilpop — CONFIGURATION TEMPLATE
# Copy it to a file of your own (e.g. config.local.toml, gitignored) and edit the
# paths for your machine. Pass it with --config. All data lives OUTSIDE the repository.
#
# INPUTS ARE DECLARED, NEVER ASSUMED. The pipeline does not impose a folder
# layout, file naming or column names on your data. You point each census year
# at your own files and name your own columns.
#
# Placeholders usable inside input paths (all optional; use only what your own
# file naming needs):
#   {year}    census year
#   {uf}      UF acronym, e.g. RS            (lookup: data/ufs.json)
#   {uf_id}   IBGE UF numeric code, e.g. 43  (lookup: data/ufs.json)
# Raster name patterns also take {provider}, {version}, {variable}, {variant},
# {spec}, {resolution} and {extension}; the manifest patterns take {output_dir}.
#
# WHAT IS NOT HERE. Fixed reference data that does not depend on your inputs
# lives in the repository's data/ folder and is loaded automatically:
#   data/ufs.json            UF acronym <-> IBGE code
#   data/cnefe_codes.json    species / subtype code dictionaries per census year
#   data/layer_catalog.json  the raster layers each census year produces
#   data/styles/             QGIS style templates ({address|population}_{resolution}.qml)
# A config that defines [ufs], [codes] or [rasterization.catalog] is rejected.
#
# EVERY STAGE HAS ITS OWN `output_dir`, declared in its own block. A stage reads
# the previous stage's output_dir, so nothing is repeated. Raw inputs are full
# paths in the block that uses them. An output_dir may contain {year} to keep
# census years in separate folders; without it years share the folder (every
# file name carries its year).
# ==============================================================================

[project]
version = "6"                      # used in output file names: BRAZILPOP_V{version}_...
provider = "BRAZILPOP"
extension = "BRAZIL"               # {EXTENSION} field of the raster naming convention

# ==============================================================================
# EXECUTION
# ==============================================================================
[execution]
target_year = 2022
target_ufs  = ["RS"]               # empty list = every UF in data/ufs.json whose input file exists
log_level   = "INFO"
overwrite   = false              # refuse to overwrite existing outputs unless true

# ==============================================================================
# RESOLUTIONS — one table per resolution; its code appears in raster file names
# and selects the QML style (data/styles/{address|population}_{code}.qml)
#
# The grid of each resolution is DEFINED BY THE RASTER YOU PROVIDE as `template`
# (extent, pixel size, origin, CRS). The three resolutions are independent
# rasters: each is rasterized on its own and nothing is ever resampled between
# them. The code (030, 01C, 01K) is only a name.
# A template must be a UInt16 raster in EPSG:4326 (the CRS of the address points);
# anything else is rejected at startup. Only its grid is used: its contents, NoData
# value and band count are ignored.
# ==============================================================================
[resolutions.030]
template = "/mnt/hdd1/brazilpop/templates/BRAZILPOP_TEMPLATE_030.tif"

[resolutions.01C]
template = "/mnt/hdd1/brazilpop/templates/BRAZILPOP_TEMPLATE_01C.tif"

[resolutions.01K]
template = "/mnt/hdd1/brazilpop/templates/BRAZILPOP_TEMPLATE_01K.tif"

# ==============================================================================
# STAGE 1 — INGESTION (one adapter per census vintage)
# Every adapter emits the Minimal Canonical Contract (see README), and nothing
# else, because later stages add what they need by joining:
#   geometry, is_household, cod_especie, cod_subtipo
#
# The canonical names apply to OUTPUT only. On the input side, every col_* key
# below maps one of YOUR column names to a canonical field. Required keys must
# be set; optional keys may be left empty ("") and the canonical field is NULL.
# ==============================================================================
[ingestion]
output_dir     = "/mnt/hdd2/brazilpop/{year}/02_standardized"      # Stage 1 writes here
output_pattern = "cnefe_{year}_{uf}_standardized.gpkg"
layer_name     = "addresses"

# Profiling sidecar: distinct codes and counts per field, per UF. The layer catalog is written from this.
inventory_pattern   = "cnefe_{year}_{uf}_code_inventory.csv"
fail_on_unknown_codes = false     # true = stop if a code is missing from data/cnefe_codes.json; false = log and count

[ingestion.2022]
adapter      = "stages/adapters/parse_cnefe_2022.py"
# Full path to one UF's raw file, in YOUR naming. Placeholders optional.
input        = "/mnt/hdd1/brazilpop/raw/cnefe/2022/{uf_id}_{uf}.csv"
encoding     = "utf-8"
delimiter    = ";"
# chunk_rows = 500000   # optional: rows read per chunk (memory vs speed)

# Required
col_lon       = "LONGITUDE"
col_lat       = "LATITUDE"
col_species   = "COD_ESPECIE"          # household status comes from data/cnefe_codes.json (household = true)

# Optional (household typology). The code, not the label, is what the raster SPEC is keyed on.
col_subtype   = "COD_TIPO_ESPECI"      # verified on 53_DF.csv: codes 101-104, filled only for species 1 and 2

# 2010: the harmonized address tables (Parquet, one file per UF). Only the `especie` column
# is used (1 domicílio particular, 2 domicílio coletivo, 3 agropecuário, 4 ensino, 5 saúde,
# 6 outras finalidades, 7 em construção). There is no religious species and no household
# subtype in 2010, so col_subtype is empty and those layers are not produced.
[ingestion.2010]
adapter      = "stages/adapters/parse_cnefe_2010.py"
input        = "/mnt/hdd1/brazilpop/raw/cnefe/2010/{uf_id}.parquet"

col_lon       = "lon"
col_lat       = "lat"
col_species   = "especie"               # household status comes from data/cnefe_codes.json (household = true)
col_subtype   = ""                      # 2010 has no household typology

# ==============================================================================
# STAGE 2 — VECTOR ENRICHMENT & DENSITY (delta_T = P_T / H_T,i)
# ==============================================================================
[enrichment]
output_dir      = "/mnt/hdd2/brazilpop/{year}/03_enriched"      # Stage 2 writes here; it reads Stage 1 from [ingestion] output_dir
output_pattern  = "cnefe_{year}_{uf}_enriched.gpkg"
balance_pattern = "cnefe_{year}_{uf}_balance.gpkg"
report_pattern  = "cnefe_{year}_{uf}_stage2_report.json"   # counts, unallocated mass and the conservation check
layer_name      = "addresses"                                 # name of the point layer in the enriched file (Stage 3 reads the same key); {year} {uf} {uf_id} allowed
chunk_rows      = 500000                                      # points per chunk (memory vs speed)

# Address points are assigned to tracts by spatial join only (never by a sector
# code). The tract layer is always transformed to EPSG:4326 first; this is not
# configurable.

# Output field names added to each address point
out_tract_code = "cd_setor"
out_h_ti       = "h_ti"            # H_T,i  physical household points in the tract
out_p_i        = "p_i"             # population of the address: delta_T = P_T / H_T,i for a household point (NULL where undefined), 0 for a non-household point
out_orphan     = "orphan"

# Unallocated mass is NEVER redistributed, snapped or burned at a centroid. Both
# cases below get zero resident population and are tracked in the balance file:
#   * a tract with P_T > 0 and no household points (its mass is "unallocated")
#   * a point outside every tract (orphan = 1)
# The run report totals the unallocated mass per UF.

# Inputs per census year, in YOUR file naming and YOUR column names.
[enrichment.2022]
# Tracts and microdata are declared separately: they may live in the same file
# (as in IBGE's consolidated 2022 GeoPackage) or in different files and formats.
#
#   tract_path             polygon file, by extension: any OGR format (.gpkg,
#                          .shp, .geojson, .fgb, ...) or GeoParquet (.parquet)
#   tract_layer            layer name. Required when the file has several layers
#   tract_code_column      tract code in the geometry   \ the two columns the
#   microdata_code_column  tract code in the table      / relational join uses
#
#   microdata_path         table, by extension:
#                            .gpkg and other OGR files  + microdata_layer
#                            .parquet
#                            .csv / .txt / .tsv         + microdata_delimiter
#   microdata_delimiter    required for delimited text, e.g. ";" or ","
#   microdata_encoding     delimited text only, default "utf-8"
#   microdata_decimal      delimited text only, default "."
#
# Nothing is guessed from the data. Both sources are national: Stage 2 selects the
# UF by the leading digits (UF code) of each code column. Codes are read as text
# so leading zeros and 15-digit values are never altered; a floating-point code
# column is rejected.

tract_path        = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2022_BD_BRASIL_2022.gpkg"
tract_layer       = "setores"
tract_code_column = "setor_code"

microdata_path        = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2022_BD_BRASIL_2022.gpkg"
microdata_layer      = "basico"
microdata_code_column = "setor_code"
population_column     = "V0001"      # P_T: total de pessoas
household_column      = "V0002"      # H_T: total de domicílios

# 2010: the totals are in the layer `sinopse` (V014 = pessoas residentes, V001 = domicílios
# particulares e coletivos), NOT in `basico`, whose V001/V002 only cover permanent private households.
[enrichment.2010]
tract_path            = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2010_BD_BRASIL_2010.gpkg"
tract_layer           = "setores"
tract_code_column     = "setor_code"

microdata_path        = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2010_BD_BRASIL_2010.gpkg"
microdata_layer       = "sinopse"
microdata_code_column = "setor_code"
population_column     = "V014"      # P_T: pessoas residentes
household_column      = "V001"      # H_T: domicílios particulares e coletivos

# ==============================================================================
# STAGE 3 — DIRECT ADDITIVE RASTERIZATION
# ==============================================================================
[rasterization]
output_dir  = "/mnt/hdd3/brazilpop/{year}/04_rasters"      # Stage 3 writes {output_dir}/{resolution}/; it reads Stage 2 from [enrichment] output_dir
resolutions = ["030", "01C", "01K"]
workers = 4                        # rasters built in parallel (each is an independent set of GDAL calls)

# File names. SPEC is optional: layers with a spec use the first pattern, layers without use the second.
#   BRAZILPOP_V6_CNEFE_ADDRESS-01_030_BRAZIL_2022.tif
#   BRAZILPOP_V6_POPULATION_RESIDENT_030_BRAZIL_2022.tif
name_pattern_spec   = "{provider}_V{version}_{variable}_{variant}-{spec}_{resolution}_{extension}_{year}.tif"
name_pattern_nospec = "{provider}_V{version}_{variable}_{variant}_{resolution}_{extension}_{year}.tif"

[rasterization.encoding.counts]
dtype      = "uint16"
nodata     = 65535                 # max valid count per cell = 65534
fill_value = 0
warn_on_saturation = true          # a cell that reaches 65535 (the NoData value) is reported: UInt16 adds stop there

[rasterization.encoding.population]
dtype      = "float32"
nodata     = -9999.0
fill_value = 0.0

# Counts are burned straight into a copy of the template, as the legacy script did, so the
# output has the template's own layout and compression. `write_cog = true` adds a last step
# that rewrites each raster as a Cloud Optimized GeoTIFF with the settings below (this also
# compacts the file, which grows a little with every UF pass). Off by default.
[rasterization.geotiff_profile]
write_cog = false
blocksize = 512
compress  = "ZSTD"
predictor_integer = 2
predictor_float   = 3
# Overviews are display-only. The README asks for SUM resampling, which GDAL's
# COG/gdaladdo does not support (3.8): leave this off, or pick a supported method
# (AVERAGE shows the mean count per cell, not the count of the coarser cell).
build_overviews     = false
overview_resampling = "AVERAGE"

# One row per raster: layer, status, total, maximum, whether it saturated, file
[rasterization.manifest]
write   = true
pattern = "{output_dir}/manifest_{year}.csv"
report_pattern = "{output_dir}/stage3_report_{year}.json"   # totals and the consistency checks below

# Consistency checks run after burning, within each resolution (results are written
# to the report; a failed check is flagged, not fatal). Totals only: the rasters
# of different resolutions are never compared with each other.
[rasterization.checks]
counts_vs_stage2_points = true                   # ADDRESS-00 total == points, HOUSEHOLD-000 total == households (Stage 2 report). A gap = points outside the template extent
household_total_equals_species_1_plus_2 = true   # HOUSEHOLD-000 total == ADDRESS-01 + ADDRESS-02 totals (only if both exist in the year's catalog)
subtype_sum_vs_household_total = true            # sum of HOUSEHOLD-1xx vs HOUSEHOLD-000; residual = households with unknown subtype (only if subtype layers exist)
population_total_vs_microdata  = true            # POPULATION total == P_T allocated in Stage 2 (P_T minus the unallocated mass)
population_relative_tolerance  = 1e-6            # accumulated in Float64, stored as Float32

# ==============================================================================
# STAGE 4 — BENCHMARKING
# Compares the population surfaces with the census at four scales: tract, district,
# municipality and state. The result is for the whole run (all selected UFs together).
#
#   * tracts, districts and municipalities are each summed over their OWN polygons;
#   * a state is the sum of its municipalities (the 2022 database has no state layer);
#   * a raster cell belongs to the polygon that contains its centre (stages/zonal.py);
#   * the census total of a unit is the sum of its tracts' microdata (code prefix).
# Tract polygons and the microdata come from [enrichment.<year>].
#
# Columns written per product `<key>`: pi_sum_<key>_<year>, err_<key>_<year> and pct_err_<key>_<year>
# (<year> = the year of the product's data, `epoch`)
# (against the census).
# ==============================================================================
[benchmarking]
output_dir      = "/mnt/hdd3/brazilpop/{year}/benchmarks"      # Stage 4 writes here; it reads Stage 3 from [rasterization] output_dir
scales          = ["tract", "district", "municipality", "state"]
workers         = 8                       # worker processes sampling raster windows (about 1 GB each)
window_cells    = 50000000               # raster cells per window (memory against speed)
master_pattern  = "benchmark_{year}_tracts.gpkg"      # one polygon per tract with every column
table_pattern   = "benchmark_{year}_{scale}.csv"      # one table per scale
metrics_pattern = "benchmark_{year}_metrics.csv"      # bias, MAE, RMSE, MAPE and totals per product and scale
report_pattern  = "benchmark_{year}_report.json"

# Charts drawn when the tables are written (tools/plot_benchmark.py; `--no-plots` skips them;
# the same tool redraws them from its own JSON file, tools/plot_benchmark.example.json).
# They go to {output_dir}/plots. A chart that fails never costs the tables.
plots        = true
plot_kinds   = ["scatter", "hexbin"]                     # one dots-per-unit figure and one hexagon-density figure per scale
plot_scales  = ["tract", "district", "municipality"]    # "state" may be added
plot_mode    = "light"                                   # or "dark"
plot_dpi     = 150

# District and municipality polygons per census year, in YOUR file naming and columns.
# `<scale>_name_column` is optional (a readable name in the tables).
[benchmarking.2022]
district_path            = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2022_BD_BRASIL_2022.gpkg"
district_layer           = "distritos"
district_code_column     = "distrito_code"
district_name_column     = "distrito_name"
municipality_path        = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2022_BD_BRASIL_2022.gpkg"
municipality_layer       = "municipios"
municipality_code_column = "municipio_code"
municipality_name_column = "municipio_name"

[benchmarking.2010]
district_path            = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2010_BD_BRASIL_2010.gpkg"
district_layer           = "distritos"
district_code_column     = "distrito_code"
district_name_column     = "distrito_name"
municipality_path        = "/mnt/hdd1/brazilpop/raw/census/IBGE_CENSO-2010_BD_BRASIL_2010.gpkg"
municipality_layer       = "municipios"
municipality_code_column = "code"
municipality_name_column = "name"

# Products. The key becomes part of the column name: pi_sum_brazilpop_2022, pi_sum_landscan_2022, ...
# `label`: the name shown in charts (optional, default: the key). `min_scale`: the product
# enters the accuracy metrics from this scale up (a coarse raster is not fairly evaluated on
# small units). `years`: census years it applies to (optional).
#
# BrazilPop is read from the Stage 3 population rasters. `stage3_resolution` is used at every
# scale, except the ones listed in `resolution_by_scale`: here tracts are sampled from the
# 30 m raster (a quality check) and the larger units from the 100 m raster.
[benchmarking.products.brazilpop]
label             = "BrazilPop V{version} {year}"   # {version} = [project] version, {year} = benchmark year
stage3_resolution = "01C"
min_scale         = "tract"

[benchmarking.products.brazilpop.resolution_by_scale]
tract = "030"

# External rasters: a full path (may use {year}). EPSG:4326, one band, NoData declared.
# Add one block per benchmark; nothing else changes.
#
# One product, several analysis years: put the raster of each census year in a sub-table named
# by that year. `epoch` is the nominal year of the data (default: the analysis year) and fills
# {epoch} in `raster` and `label`. The column stem is the same in every run (pi_sum_ghsl_2020 / _2010), and a
# product with sub-tables is used only in the years it lists:
#
#   [benchmarking.products.ghsl]
#   label     = "GHSL {epoch}"
#   min_scale = "municipality"
#   [benchmarking.products.ghsl.2010]
#   raster    = ".../GHSL_BRAZIL_2010.tif"
#   epoch     = 2010
#   [benchmarking.products.ghsl.2022]
#   raster    = ".../GHSL_BRAZIL_2020.tif"
#   epoch     = 2020
[benchmarking.products.landscan]
label     = "LandScan {year}"
raster    = "/media/ipo/Feynman/planalto/ZENODO/BRAZILPOP/V500/T1/ASSETS/BCMK/LANDSCAN_BRAZIL_{year}.tif"
min_scale = "municipality"
years     = [2022]

[benchmarking.products.worldpop]
label     = "WorldPop {year}"
raster    = "/media/ipo/Feynman/planalto/ZENODO/BRAZILPOP/V500/T1/ASSETS/BCMK/WORLDPOP_BRAZIL_{year}.tif"
min_scale = "municipality"
years     = [2022]

# The GHSL epoch is 2020 while the census is 2022: the path has no {year} and the label says so.
[benchmarking.products.ghsl]
label     = "GHSL 2020"
raster    = "/media/ipo/Feynman/planalto/ZENODO/BRAZILPOP/V500/T1/ASSETS/BCMK/GHSL_BRAZIL_2020.tif"
min_scale = "municipality"
years     = [2022]

# HRSL (Meta) is a 2018 snapshot, built as a virtual mosaic of its four tiles by
# scripts/merge_hrsl.py (mode vrt). Float64, NoData NaN. Until its column exists in the
# Stage 4 table, the charts show it as a null bar and a "no data" panel.
[benchmarking.products.hrsl]
label     = "HRSL V1 2018"
raster    = "/media/ipo/Feynman/planalto/META/HRSL/V1/T1/ASSETS/HRSL_BRAZIL_2018.vrt"
min_scale = "municipality"
years     = [2022]
